<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>signalbox</title>
    <!-- No icon yet, and no request for one. -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="yard"></div>
    <div id="tip"></div>
    <!-- One bead, after a click on its wagon. -->
    <aside id="card" aria-live="polite" hidden></aside>
    <div id="note"></div>
    <!-- The player of a replay: shown when the snapshot came with events. -->
    <div id="bar" hidden>
      <button id="play" type="button">Play</button>
      <!-- Back to now: shown when the page follows a yard as it runs. -->
      <button id="live" type="button" hidden>Live</button>
      <!-- In its place when no yard is behind the page: what plays is the made-up yard of public/. -->
      <span id="demo" title="A made-up yard, not yours. scripts/serve.mjs shows a yard as it runs." hidden>Demo</span>
      <span id="speeds" role="group" aria-label="Speed"></span>
      <!-- The yard's sounds: off until it is pressed. -->
      <button id="sound" type="button" aria-pressed="false">Sound</button>
      <!-- The night palette, where the reader's system does not say. -->
      <button id="night" type="button" aria-pressed="false">Night</button>
      <!-- The departure board: the beads in progress, over the yard. -->
      <button id="departures" type="button" aria-pressed="false">Departures</button>
      <input id="scrub" type="range" min="0" value="0" step="1000" aria-label="Time of the yard" />
      <output id="clock"></output>
      <output id="event"></output>
    </div>
    <!-- The departure board: the beads in progress, over the yard. The scene
         keeps running behind it; a close button and Escape close it. -->
    <div id="board" role="dialog" aria-label="Departures" hidden>
      <div class="band"><h2>Departures</h2><button id="board-close" type="button">Close</button></div>
      <table>
        <thead>
          <tr>
            <th scope="col">Time</th>
            <th scope="col" aria-label="Group"></th>
            <th scope="col">Destination</th>
            <th scope="col">Platform</th>
            <th scope="col">Line</th>
            <th scope="col">Remarks</th>
          </tr>
        </thead>
        <tbody id="board-rows"></tbody>
      </table>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
